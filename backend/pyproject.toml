[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-stream-editor-backend"
version = "0.1.0"
description = "Processamento local de cortes verticais para revisão"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.54,<1", "faster-whisper>=1.1,<2", "yt-dlp==2026.10.26", "opencv-python-headless==4.14.0.94"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["ai_stream_editor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
